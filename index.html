<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Results summary component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="left-section">
        <div class="result">Your Result</div>

        <div class="number-container">
          <div class="number">76</div>
          <span class="out-of"> of 100 </span>
        </div>

        <div class="great">Great</div>
        <div class="report">
          <p >
            You scored higher than 65% of 
             <p class="p1">the people who have taken</p>
                <p class="p2"> these tests.</p>
          </p>
        </div>
      </section>

      <section class="right-section">
        <div class="summary">Summary</div>
        <div class="reaction">
          <div class="left-side">
            <img src="assets/images/icon-reaction.svg" alt="" />
            Reaction
          </div>
          <div class="right-side">
              <div> <span>80</span> / 100</div> 
          </div>
          
          </div>
        </div>

        <div class="memory">
          <div class = "left-side">
            <img src="assets/images/icon-memory.svg" alt="" /> 
            Memory
          </div>
          <div class="right-side"><div> <span>92 </span>/ 100</div></div>
          
        </div>

        <div class="verbal">
          <div class="left-side">
            <img src="assets/images/icon-verbal.svg" alt="" />
            Verbal
          </div>
          
          <div class="right-side">
            <div> <span>61 </span>/ 100</div>
          </div>
          
        </div>

        <div class="visual">
          <div class="left-side">
            <img src="assets/images/icon-visual.svg" alt="" />
            Visual
          </div>
          
          <div class="right-side">
            <div> <span>73</span> / 100</div>
          </div>
          
        </div>

        <button class="continue">Continue</button>
      </section>
    </main>

    <!--<div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>.
    </div>
  --></body>
</html>
